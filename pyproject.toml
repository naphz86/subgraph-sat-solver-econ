[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subgraph-sat-solver-econ"
version = "2.0.0"
description = "Wirtschaftliche Modelle als SAT-Probleme in Python mit dem subgraph-sat-solver"
authors = [
    { name = "Stephan Epp" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "matplotlib>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
]

[tool.setuptools]
# Das Verzeichnis `src` ist selbst das Paket. Ohne diese Abbildung verteilt setuptools
# die Module (welfare.py, backends.py, ...) als lose Top-Level-Module in site-packages.
packages = ["subgraph_sat_solver_econ"]
package-dir = { subgraph_sat_solver_econ = "src" }

[tool.setuptools.package-data]
subgraph_sat_solver_econ = ["native/*"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "doc/*",
    "src/native/*",
    "src/experiments.py",
    "src/native.py",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q --cov=src --cov-report=html:doc/coverage --cov-report=term-missing"
markers = [
    "unit: unit test",
    "integration: component integration test",
    "slow: computationally expensive test",
]
